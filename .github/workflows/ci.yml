name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test -- --run
      - run: npm run build
      - name: Auth / prod file checks
        run: |
          test -f src/providers/PrivyProvider.tsx
          test -f supabase/functions/privy-exchange/index.ts
          test -f supabase/functions/send-contact-email/index.ts
          test -f supabase/functions/create-campaign-checkout/index.ts
          test -f supabase/functions/nardopay-webhook/index.ts
          test -f supabase/functions/request-creator-payout/index.ts
          test -f supabase/functions/create-plan-checkout/index.ts
          test -f supabase/PAYOUTS_OPS.sql
          test -f supabase/LAUNCH.sql
          test -f supabase/VERIFY_LAUNCH.sql
          test -f supabase/CRON_VERIFY_VIEWS.sql
          test -f supabase/PATCH_PAYMENT_IDEMPOTENCY.sql
          test -f src/pages/AdminPanel.tsx
          test -f src/lib/edge-errors.ts
          ! git grep -n "signInAnonymously\|lovable.auth\|nardopay_webhook_secret" -- 'src/**/*.ts' 'src/**/*.tsx' 'supabase/functions/**/*.ts' || exit 1
          git grep -n "corsForRequest" -- 'supabase/functions/privy-exchange/index.ts' 'supabase/functions/send-contact-email/index.ts' >/dev/null
          git grep -n "createOnLogin: 'off'" -- 'src/providers/PrivyProvider.tsx' >/dev/null
