<html lang="en">

    <!-- Preconnect to font origins for faster loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <!-- Load Google Fonts via link tags instead of CSS @import (removes render blocking) -->

      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@300;400;500;600;700&family=Inter+Tight:wght@300;400;500;600;700&family=Nunito:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />

      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@300;400;500;600;700&family=Nunito:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap"
      />

    <link rel="preload" as="image" href="/src/assets/hero-background.jpg" fetchpriority="high" />

    <meta name="twitter:description" content="Brands fund a campaign. Creators post videos to their own accounts. Everyone gets paid per view, straight to mobile money." />
  </head>
