<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A101D" />
    <meta name="color-scheme" content="light" />

    <!-- Preconnect to font origins for faster loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Load Google Fonts via link tags instead of CSS @import (removes render blocking) -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@300;400;500;600;700&family=Inter+Tight:wght@300;400;500;600;700&family=Nunito:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@300;400;500;600;700&family=Inter+Tight:wght@300;400;500;600;700&family=Nunito:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap"
      />
    </noscript>

    <!-- Preload critical LCP image with high priority -->
    <link rel="preload" as="image" href="/src/assets/hero-background.jpg" fetchpriority="high" />
    <link rel="preload" as="image" href="/src/assets/about/about-bg.jpg" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="canonical" href="https://twen.app/" />

    <title>Twen — Africa's content distribution network</title>
    <meta
      name="description"
      content="Twen is the largest content distribution network in Africa. Brands fund campaigns. Creators get paid per verified view, straight to mobile money."
    />
    <meta name="author" content="Twen" />
    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />
    <meta name="googlebot" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="application-name" content="Twen" />
    <meta name="format-detection" content="telephone=no" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:site_name" content="Twen" />
    <meta property="og:url" content="https://twen.app/" />
    <meta property="og:title" content="Twen — Africa's content distribution network" />
    <meta
      property="og:description"
      content="The largest content distribution network in Africa. Brands fund a campaign. Creators post. Everyone gets paid per view."
    />
    <meta property="og:image" content="https://twen.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Twen — Africa's content distribution network" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Twen — Africa's content distribution network" />
    <meta
      name="twitter:description"
      content="The largest content distribution network in Africa. Brands fund a campaign. Creators post. Everyone gets paid per view."
    />
    <meta name="twitter:image" content="https://twen.app/og.png" />
    <meta name="twitter:image:alt" content="Twen — Africa's content distribution network" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Twen",
        "url": "https://twen.app",
        "logo": "https://twen.app/icon-512.png",
        "email": "hello@twen.app",
        "description": "Twen is the largest content distribution network in Africa. Brands fund campaigns. Creators get paid per verified view, straight to mobile money."
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Twen",
        "url": "https://twen.app",
        "description": "Twen is the largest content distribution network in Africa. Brands fund campaigns. Creators get paid per verified view, straight to mobile money.",
        "inLanguage": "en",
        "publisher": {
          "@type": "Organization",
          "name": "Twen",
          "url": "https://twen.app"
        }
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Twen",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "url": "https://twen.app",
        "description": "Twen is the largest content distribution network in Africa. Brands fund campaigns. Creators get paid per verified view, straight to mobile money.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
